services:
  # ── Infrastructure ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verifynng
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/verifynng || true;
      "

  mailpit:
    image: axllent/mailpit
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Fake external services ────────────────────────────────
  fake-sms:
    build:
      context: ../tools/fakes/sms
      dockerfile: Dockerfile
    ports:
      - '${FAKE_SMS_PORT:-4101}:4101'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4101/health']
      interval: 5s
      timeout: 5s
      retries: 5

  fake-pay:
    build:
      context: ../tools/fakes/pay
      dockerfile: Dockerfile
    ports:
      - '${FAKE_PAY_PORT:-4102}:4102'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4102/health']
      interval: 5s
      timeout: 5s
      retries: 5

  fake-geo:
    build:
      context: ../tools/fakes/geo
      dockerfile: Dockerfile
    ports:
      - '${FAKE_GEO_PORT:-4103}:4103'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4103/health']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Application services ──────────────────────────────────
  db-migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command:
      [
        'sh',
        '-c',
        'cd packages/db && npx prisma migrate deploy && npx prisma db seed',
      ]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/verifynng?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - '${API_HOST_PORT:-4000}:4000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/verifynng?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: '4000'
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: verifynng
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PASS: ''
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:4000/ready']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web-verify:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web-verify
    ports:
      - '${WEB_VERIFY_PORT:-3000}:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web-admin
    ports:
      - '${WEB_ADMIN_PORT:-3001}:3001'
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Load testing (profile: load) ────────────────────────
  k6:
    image: grafana/k6:0.54
    profiles:
      - load
    volumes:
      - ../tools/load:/scripts:ro
      - load-results:/results
    environment:
      API_URL: http://api:4000
    entrypoint: ['/scripts/docker-entrypoint.sh']
    depends_on:
      api:
        condition: service_healthy

  # ── Observability stack (profile: observability) ───────────
  grafana:
    image: grafana/grafana:11
    profiles:
      - observability
    ports:
      - '${GRAFANA_PORT:-3100}:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

  loki:
    image: grafana/loki:3.0.0
    profiles:
      - observability
    ports:
      - '${LOKI_PORT:-3101}:3100'
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro

  tempo:
    image: grafana/tempo:2.4.1
    profiles:
      - observability
    ports:
      - '${TEMPO_PORT:-3102}:3200'
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  prometheus:
    image: prom/prometheus:v2.51.0
    profiles:
      - observability
    ports:
      - '${PROMETHEUS_PORT:-3103}:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    profiles:
      - observability
    ports:
      - '${OTEL_COLLECTOR_PORT:-3104}:4317'
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro

  uptime-probe:
    build:
      context: ../tools/uptime-probe
      dockerfile: Dockerfile
    profiles:
      - observability
    ports:
      - '${UPTIME_PROBE_PORT:-3105}:9465'
    environment:
      API_URL: http://api:4000
      WEB_VERIFY_URL: http://web-verify:3000
      WEB_ADMIN_URL: http://web-admin:3001
      PROBE_KEY: ${PROBE_KEY:-probe-secret-local}
      PROBE_FIXTURE_CODE: ${PROBE_FIXTURE_CODE:-PROBE_TIER1_OK}

volumes:
  pgdata:
  redisdata:
  miniodata:
  load-results:
