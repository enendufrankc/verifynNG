# Production overlay — docker compose -f docker/compose.yml -f docker/compose.prod.yml
# --env-file /opt/verifynng/.env.production up -d --build
#
# The fakes (fake-geo, mailpit, fake-oidc, webhook-sink) must NOT run in
# production: geo comes from Cloudflare headers, mail from Resend, SSO from
# real IdPs. fake-pay and fake-captcha DO run (internal-only, no ingress) —
# PAYMENT_GATEWAY=fake and CAPTCHA_PROVIDER=fake are the launch posture until
# Paystack/Turnstile are switched on. The systemd unit starts an explicit
# service list, so unlisted fakes simply never start.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on:
      web-verify:
        condition: service_healthy
      web-admin:
        condition: service_healthy
      api:
        condition: service_healthy

  api:
    restart: unless-stopped
    environment: &prod_api_env
      DEPLOYMENT_ENV: production
      NODE_ENV: production
      # Real keys — generated by scripts/deploy/gen-secrets.sh, backed up in
      # the owner's password manager. E13's fail-fast refuses the dev
      # defaults once DEPLOYMENT_ENV=production, so a missing value here is a
      # boot error, not a silent downgrade.
      JWT_KEYS: ${JWT_KEYS:?}
      CORE_KEYS: ${CORE_KEYS:?}
      CORE_ACTIVE_KID: ${CORE_ACTIVE_KID:?}
      MFA_ENC_KEY: ${MFA_ENC_KEY:?}
      MANIFEST_ENC_KEY: ${MANIFEST_ENC_KEY:?}
      BILLING_PAYMENT_METHOD_ENC_KEY: ${BILLING_PAYMENT_METHOD_ENC_KEY:?}
      SSO_CLIENT_SECRET_ENC_KEY: ${SSO_CLIENT_SECRET_ENC_KEY:?}
      WEBHOOK_SECRET_ENC_KEY: ${WEBHOOK_SECRET_ENC_KEY:?}
      PAGE_REVALIDATE_SECRET: ${PAGE_REVALIDATE_SECRET:?}
      CONSENT_SALT: ${CONSENT_SALT:?}
      IP_HASH_SALT: ${IP_HASH_SALT:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/verifynng?schema=public
      # Public URLs
      VERIFY_BASE_URL: https://verifyproduct.app
      APP_BASE_URL: https://admin.verifyproduct.app
      OEM_PORTAL_BASE_URL: https://admin.verifyproduct.app
      PAGES_PUBLIC_BASE_URL: https://verifyproduct.app
      SSO_CALLBACK_URL: https://api.verifyproduct.app/auth/sso/callback
      # Mail: Resend adapter (E14) instead of Mailpit.
      MAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      # Geo comes from cf-ipcountry/cf-ipcity headers (verify.controller);
      # fake-geo is not started, and this URL is never reached.
      GEOIP_PROVIDER: fake
      # Hardening: schema defaults are already safe, restated for greppability.
      WEBHOOKS_ALLOW_HTTP: 'false'
      WEBHOOKS_ALLOW_PRIVATE: 'false'

  api-worker:
    restart: unless-stopped
    environment: *prod_api_env

  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}

  db-migrate:
    environment:
      DEPLOYMENT_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/verifynng?schema=public
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}

  web-verify:
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_API_URL: https://api.verifyproduct.app

  web-admin:
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_API_URL: https://api.verifyproduct.app
